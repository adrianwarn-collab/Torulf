<style>
/* VOICE: en peppande träningskompis – rak, kort, aldrig tjatig.
   IDEA: en sliten träningsdagbok/whiteboard på gymmet – veckan som tavla, passet som kort.
   PICTURE: veckoremsan med sju dagkort och dagens pass överst; kettlebell som märke.
   COLOUR and TYPE: krita #f1efe9, järnsvart, kettlebellröd accent, stålblå stöd; Archivo 900/500.
   LAYOUT: en kolumn, max 720px, fast flikrad nederst, kort som går kant till kant på mobil. */
:root{color-scheme:light dark;
/* --badge-h: höjden på Netlifys "Powered by"-bricka (0 när den saknas), sätts av badgeFix() */
--badge-h:0px;--nav-bot:max(env(safe-area-inset-bottom),var(--badge-h));
--bg:light-dark(#f1efe9,#121315);--panel:light-dark(#ffffff,#1d1f22);--ink:light-dark(#141414,#efede8);
--mut:light-dark(#5e5c57,#a5a39d);--line:light-dark(#dedad1,#2e3135);--red:light-dark(#d62f26,#ff5a48);
--blue:light-dark(#2f5577,#7fb0dc);--soft:light-dark(#e7e3da,#26292d);--ok:light-dark(#2f6b45,#6fcf92)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + var(--nav-bot))}
h1,h2,h3{margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(30px,8vw,44px);font-weight:900;letter-spacing:-.02em}
h2{font-size:24px;font-weight:800}
h3{font-size:17px;font-weight:700}
p{margin:.3em 0}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-left)) 6px;max-width:720px;margin:0 auto}
header.top svg{width:68px;height:68px;flex:none}
.hero{display:block;width:min(220px,60vw);height:auto;margin:0 auto 8px}
header.top .sub{color:var(--mut);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.muted{color:var(--mut)}.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
button,.btn{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);min-height:44px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{background:transparent}
button.sm{min-height:36px;padding:4px 10px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 10px;width:100%}
textarea{min-height:90px}
label{font-size:14px;color:var(--mut);display:block;margin:10px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border-radius:999px;min-height:38px;padding:4px 14px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* week */
.week{display:grid;gap:8px}
.day{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;min-height:64px}
.day .dn{font-weight:900;font-size:20px;line-height:1}.day .dd{font-size:13px;color:var(--mut)}
.day.rest{background:transparent;border-style:dashed}
.day.today{border:2px solid var(--red)}
.tag{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--soft);white-space:nowrap}
.tag.done{background:var(--ok);color:var(--bg)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;margin-top:10px}
.badge{text-align:center;font-size:13px;line-height:1.25}
.badge svg{width:56px;height:56px;display:block;margin:0 auto 4px}
.badge.off{opacity:.45}
.badge b{display:block;font-size:13px}
.report{white-space:pre-wrap;font:14px/1.5 Archivo,system-ui,sans-serif;background:var(--soft);border-radius:10px;padding:12px;margin:10px 0}
.celebrate{text-align:center}
.celebrate .badge{display:inline-block;width:110px;vertical-align:top;margin:6px}
.block{display:flex;gap:6px;margin:10px 0 4px}
.block span{flex:1;height:10px;border-radius:5px;background:var(--soft)}
.block span.on{background:var(--red)}.block span.past{background:var(--ink);opacity:.35}
.nudge{border-left:5px solid var(--blue);background:var(--panel);border-radius:12px;padding:12px 14px;margin:10px 0}
.nudge b{display:block}
/* session */
.ex{border-top:1px solid var(--line);padding:14px 0}
.ex:first-of-type{border-top:0}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center;margin-top:8px}
.sets .h{font-size:12px;color:var(--mut)}
.chk{width:44px;height:44px;border-radius:10px;padding:0;display:grid;place-items:center}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.hint{font-size:14px;background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px}
details summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--nav-bot));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 10px 8px 18px;display:flex;gap:10px;align-items:center;z-index:20;box-shadow:0 6px 20px #0004}
.timer b{font-size:22px;font-variant-numeric:tabular-nums;min-width:64px}
.timer button{background:transparent;color:var(--bg);border-color:#fff4;min-height:38px}
/* bank */
.exlist{display:grid;gap:0}
.exitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;background:none;border-radius:0;border-width:0 0 1px;width:100%}
.eq{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap;color:var(--mut)}
/* body */
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:40px;height:52px;padding:0;border-radius:6px 6px 12px 12px;background:var(--bg);position:relative;overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--blue);transition:height .3s}
.glass.on i{height:78%}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-size:34px;font-weight:900;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px;margin-top:10px}
.bars div{background:var(--blue);border-radius:6px 6px 2px 2px;position:relative;min-height:3px}
.bars div.good{background:var(--ok)}
.barl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:12px;color:var(--mut);text-align:center}
.tip{border-top:1px solid var(--line);padding:6px 0}
.tip:first-child{border-top:0}
.tip p{color:var(--mut)}
.big{font-size:clamp(34px,10vw,52px);font-weight:900;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats b{display:block;font-size:28px;font-weight:900}
.stats span{font-size:13px;color:var(--mut)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:var(--nav-bot);z-index:10}
nav.tabs button{border:0;border-radius:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut);min-height:64px;padding:6px 2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--red)}
.sheet{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom) + var(--badge-h))}
.daypick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daypick button{padding:0;font-weight:800}
.daypick button.on{background:var(--red);border-color:var(--red);color:#fff}
.dayset{display:grid;grid-template-columns:60px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-weight:600}
.empty{text-align:center;padding:24px 10px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
{
/* ---------- Övningsbank ---------- */
// e: g=gym, k=kettlebell, b=kroppsvikt · t:1 = mäts i sekunder
const BANK=[

['rdl','Rumänsk marklyft skivstång','Baksida','hinge','g','Lätt böjda knän, skjut höften bakåt, stången nära benen, rak rygg.'],
['mark','Marklyft','Baksida','hinge','g','Stången över mitten av foten, rak rygg, tryck golvet ifrån dig. Lär dig med lätt vikt och be en instruktör kolla.'],
['rdlh','Rumänsk marklyft hantlar','Baksida','hinge','g','Som med stång men hantlarna längs benen. Känn sträckningen bak i låret.'],
['hipt','Höftlyft med skivstång','Rumpa','hinge','g','Övre ryggen mot bänk, stången över höften, pressa upp och kläm rumpan.'],

const KEY='torulf.v1';
const today=()=>dkey(new Date());
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}

/* ---------- Program ---------- */
function progInfo(){
 const st=S.setup;if(!st)return null;
 const w=Math.max(0,Math.floor((monday(new Date())-monday(parse(st.start)))/6048e5));
 const block=Math.floor(w/4),wib=w%4;
 const sch=SCHEMES[st.goal][block%3];
 return {w,block,wib,deload:wib===3,sch};
}
function weekPlan(){
 const st=S.setup;if(!st)return [];
 const idx=[0,1,2,3,4,5,6].filter(i=>st.days[i]);
 const seq=SPLIT[idx.length]||[];
 const occ={};
 return DAYS.map((_,i)=>{
  const k=idx.indexOf(i);
  if(k<0)return null;
  if(S.assign[i]){const wo=S.custom.wo.find(x=>x.id===S.assign[i]);if(wo)return {day:i,custom:wo,name:wo.n,place:st.place[i]||'gym'}}
  const t=seq[k];occ[t]=(occ[t]||0)+1;
  return {day:i,tpl:t,occ:occ[t]-1,name:TPL[t].n+(SPLIT[idx.length].filter(x=>x===t).length>1?' '+'ABC'[occ[t]-1]:''),place:st.place[i]||'gym'};
 });
}
function cands(p,place){return allEx().filter(x=>x.p===p&&(place==='gym'||x.e!=='g'))}
function scheme(ex,info){
 if(ex.t)return {sets:ex.p==='cond'?6:3,lo:20,hi:40,u:'s'};
 const a=COMP.includes(ex.p)?info.sch.c:info.sch.i;
 return {sets:info.deload?2:a[0],lo:a[1],hi:a[2],u:'reps'};
}
function buildDay(pd){
 const info=progInfo();
 if(pd.custom)return pd.custom.ex.map((id,j)=>{const ex=exById(id);return ex?{id,slot:j,sc:scheme(ex,info)}:null}).filter(Boolean);
 const dup={};
 return TPL[pd.tpl].s.map((p,j)=>{
  dup[p]=(dup[p]||0)+1;
  const c=cands(p,pd.place);
  const sw=S.swaps[info.block+'|'+pd.day+'|'+j];
  let ex=sw&&exById(sw);
  if(!ex)ex=c[(info.block*2+pd.occ+dup[p]-1)%c.length];
  return ex?{id:ex.id,slot:j,sc:scheme(ex,info)}:null;
 }).filter(Boolean);
}
function lastFor(id){for(let i=S.logs.length-1;i>=0;i--){const it=S.logs[i].items.find(x=>x.id===id&&x.sets.some(s=>s.reps));if(it)return {log:S.logs[i],it}}return null}
function progressHint(id,sc){
 const L=lastFor(id);if(!L)return 'Första gången: börja lätt. Välj en vikt där du kunde ha gjort 2–3 reps till med snygg teknik.';
 const sets=L.it.sets.filter(s=>s.reps);
 const kg=Math.max(...sets.map(s=>+s.kg||0));
 const txt=sets.map(s=>(s.kg?s.kg+' kg × ':'')+s.reps).join(', ');
 const allTop=sets.length>=sc.sets&&sets.every(s=>+s.reps>=sc.hi);
 const unit=sc.u==='s'?' sek':'';
 if(progInfo().deload)return 'Sist: '+txt+unit+'. Lätt vecka – samma eller lite lägre vikt, fokus på teknik.';
 if(allTop)return 'Sist: '+txt+unit+'. Du klarade toppen av intervallet – '+(kg?'öka ca 2,5 kg (eller 1–2 kg i hantlar).':'gör en tyngre variant eller lägg till vikt.');
 return 'Sist: '+txt+unit+'. Försök slå det med 1 rep per set.';
}

function applyMode(items,mode){
 if(mode==='kort')return items.slice(0,4).map(x=>({...x,sc:{...x.sc,sets:Math.max(2,x.sc.sets-1)}}));
 if(mode==='latt')return items.map(x=>({...x,sc:{...x.sc,sets:2,light:true}}));

}
function estMin(items){return Math.round((items.reduce((a,x)=>a+x.sc.sets*2.3,0)+10)/5)*5}

/* ---------- Statistik, märken, rapport ---------- */
function weekCount(a){const b=addDays(a,7);return S.logs.filter(l=>{const d=parse(l.date);return d>=a&&d<b}).length}
function planned(){return weekPlan().filter(Boolean).length}
function weekStreak(){const p=Math.max(1,planned()),mon=monday(new Date());let s=weekCount(mon)>=p?1:0;for(let i=1;i<104;i++){if(weekCount(addDays(mon,-7*i))>=p)s++;else break}return s}
function pbEvents(){
 const max={},ev=[];
 S.logs.slice().sort((a,b)=>a.ts-b.ts).forEach(l=>l.items.forEach(it=>{
  const kg=Math.max(0,...it.sets.filter(s=>+s.reps).map(s=>+s.kg||0));if(!kg)return;
  if(max[it.id]&&kg>max[it.id])ev.push({date:l.date,id:it.id,kg});
  max[it.id]=Math.max(max[it.id]||0,kg);
 }));
 return ev;
}
function sleepStreak(){let best=0,cur=0,prev=null;Object.keys(S.daily).sort().forEach(k=>{const ok=(S.daily[k].sleep||0)>=8;const cont=prev&&dkey(addDays(parse(prev),1))===k;cur=ok?(cont?cur+1:1):0;best=Math.max(best,cur);prev=k});return best}
function stats(){const L=S.logs;return {pass:L.length,streak:weekStreak(),warm:L.filter(l=>l.warm).length,stretch:L.filter(l=>l.stretch).length,pbs:pbEvents().length,sleepStreak:sleepStreak(),water:Object.values(S.daily).filter(d=>(d.water||0)>=S.set.water).length,home:L.filter(l=>l.place==='hem').length,easy:L.filter(l=>l.mode&&l.mode!=='full').length,custom:S.custom.wo.length}}
function checkBadges(){S.earned=S.earned||{};const st=stats(),nb=[];BADGES.forEach(b=>{if(!S.earned[b.id]&&st[b.k]>=b.g){S.earned[b.id]=today();nb.push(b)}});if(nb.length)save();return nb}
function medal(b,on){const lbl=b.k==='pass'?b.g:b.k==='streak'?b.g+'v':b.n[0];return `<svg viewBox="0 0 56 56" aria-hidden="true"><path d="M18 2h8l-4 16zM30 2h8l-4 16z" fill="${on?'var(--blue)':'var(--line)'}"/><circle cx="28" cy="34" r="19" fill="${on?'var(--red)':'var(--soft)'}" stroke="${on?'#0002':'var(--line)'}" stroke-width="2"/><circle cx="28" cy="34" r="14" fill="none" stroke="${on?'#fff6':'var(--line)'}" stroke-width="1.5"/><text x="28" y="39.5" text-anchor="middle" font-size="${String(lbl).length>2?12:15}" font-weight="900" font-family="Archivo,sans-serif" fill="${on?'#fff':'var(--mut)'}">${esc(lbl)}</text></svg>`}
function report(off){
 const a=addDays(monday(new Date()),-7*off),b=addDays(a,7),wk=isoWeek(a);
 const L=S.logs.filter(l=>{const d=parse(l.date);return d>=a&&d<b}).sort((x,y)=>x.ts-y.ts);
 const p=planned(),nm=S.set.name||'Jag';
 const days=[...Array(7)].map((_,i)=>S.daily[dkey(addDays(a,i))]||{});
 const sl=days.map(d=>d.sleep||0).filter(Boolean);
 const pbs=pbEvents().filter(e=>{const d=parse(e.date);return d>=a&&d<b});
 const bd=BADGES.filter(x=>{const e=S.earned[x.id];if(!e)return false;const d=parse(e);return d>=a&&d<b});
 const lines=[`Torulf – veckorapport till ${S.set.parent||'pappa'} v${wk}`,`${S.set.name?nm+': ':'Pass: '}${L.length} av ${p} planerade${L.length>=p&&p?' – hela veckan klar!':''}`];
 L.forEach(l=>lines.push(`• ${DAYS[(parse(l.date).getDay()+6)%7]} ${l.title}${l.mode&&l.mode!=='full'?' ('+(l.mode==='kort'?'kort':'lätt')+')':''}${l.feel?', kändes '+l.feel.toLowerCase():''}`));
 if(L.length)lines.push(`Uppvärmning ${L.filter(l=>l.warm).length}/${L.length} pass, stretch ${L.filter(l=>l.stretch).length}/${L.length}`);
 lines.push(sl.length?`Sömn: snitt ${(sl.reduce((x,y)=>x+y,0)/sl.length).toFixed(1).replace('.',',')} h (${sl.length} ${sl.length===1?'natt':'nätter'} loggade)`:'Sömn: inte loggad');
 lines.push(`Vatten: målet nått ${days.filter(d=>(d.water||0)>=S.set.water).length} av 7 dagar`);
 lines.push(`Mat efter träning: ${days.filter(d=>d.post).length} gånger`);
 if(pbs.length)lines.push('Nya personbästa: '+pbs.map(e=>((exById(e.id)||{}).n||'')+' '+e.kg+' kg').join(', '));
 if(bd.length)lines.push('Nya märken: '+bd.map(x=>x.n).join(', '));
 lines.push(`Veckor i rad med alla pass: ${weekStreak()}`);
 const dk=[...Array(7)].map((_,i)=>dkey(addDays(a,i)));
 lines.push('');lines.push('Användning av appen:');
 lines.push(`• Öppnat appen ${dk.filter(k=>S.opens[k]).length} av 7 dagar`);
 lines.push(`• Loggat sömn ${days.filter(d=>d.sleep).length} dagar, vatten ${days.filter(d=>d.water).length} dagar, mat ${days.filter(d=>d.fr||d.pre||d.post).length} dagar`);
 lines.push(`• Loggat vikter på ${L.filter(l=>l.items.some(it=>it.sets.some(s=>s.kg))).length} av ${L.length} pass`);
 const lo=Object.keys(S.opens).sort().pop();if(lo)lines.push(`• Senast öppnad ${parse(lo).getDate()}/${parse(lo).getMonth()+1}`);
 return {text:lines.join('\n'),key:a.getFullYear()+'-'+wk};
}

function nudges(){
 const n=[],now=new Date(),h=now.getHours()+now.getMinutes()/60,d=S.daily[today()]||{},st=S.setup;
 const plan=weekPlan(),td=plan[(now.getDay()+6)%7];
 const [bh,bm]=(S.set.bed||'22:30').split(':').map(Number),bed=bh+bm/60;
 if(h>=bed-1&&h<bed+3)n.push(['Snart läggdags',`Mål: sova ${S.set.bed}. Lägg undan mobilen 30 min innan – det är då musklerna byggs.`]);
 if(h<11&&!d.sleep)n.push(['Hur sov du?','Logga när du la dig och när du vaknade under Kropp.']);
 if(td&&st&&!dayLog(today()).length){
  const [th,tm]=(st.time[td.day]||'17:00').split(':').map(Number),tt=th+tm/60;
  if(h>=tt-3&&h<tt-0.5&&!d.pre)n.push(['Tanka inför passet',`${td.name} kl ${st.time[td.day]||'17:00'}. Ät ett mål nu: kolhydrater + lite protein, och drick ett glas vatten.`]);
  else if(h<tt-3)n.push(['Träningsdag idag',`${td.name} kl ${st.time[td.day]||'17:00'}. Ät ordentligt till lunch och ha med vattenflaskan.`]);
 }
 const lt=dayLog(today()).slice(-1)[0];
 if(lt&&!d.post&&Date.now()-lt.ts<3*36e5)n.push(['Bra jobbat – nu mat!','Ät inom ett par timmar: protein + kolhydrater. Kryssa i under Kropp.']);
 const wd=now.getDay();
 if((wd===0&&h>=17&&S.reportSent!==report(0).key)||(wd===1&&h<14&&S.reportSent!==report(1).key))n.unshift(['Veckorapport',`Dags att skicka veckorapporten till ${S.set.parent||'pappa'} – den finns under Logg.`]);
 if(h>=14&&(d.water||0)<S.set.water/2)n.push(['Drick vatten',`Du har loggat ${d.water||0} av ${S.set.water} glas idag.`]);
 return n.slice(0,2).map(x=>`<div class="nudge"><b>${esc(x[0])}</b><span class="small">${esc(x[1])}</span></div>`).join('');
}

 <div class="card"><h3>Pass per vecka</h3><div class="bars" style="grid-template-columns:repeat(8,minmax(0,1fr))">${weeks.map(w=>`<div class="${w.c>=pl&&pl?'good':''}" style="height:${w.c/max*100}%"></div>`).join('')}</div><div class="barl" style="grid-template-columns:repeat(8,minmax(0,1fr))">${weeks.map(w=>`<span>v${isoWeek(w.a)}</span>`).join('')}</div></div>
 <div class="card"><h3>Personbästa</h3>${pbs.length?pbs.map(x=>`<div class="row between tip"><span>${esc((exById(x.id)||{}).n||'')}</span><b>${esc(x.b)}</b></div>`).join(''):'<p class="small muted">Logga vikter och reps så dyker dina rekord upp här.</p>'}</div>
 <div class="card"><h3>Historik</h3>${S.logs.length?S.logs.slice().reverse().slice(0,30).map(l=>`<details class="tip"><summary>${esc(l.date)} · ${esc(l.title)}${l.feel?' · '+esc(l.feel):''}</summary>${l.items.map(it=>`<p class="small">${esc((exById(it.id)||{}).n||'')}: ${it.sets.filter(s=>s.reps).map(s=>esc((s.kg?s.kg+'×':'')+s.reps)).join(', ')||'–'}</p>`).join('')}<button class="sm ghost" data-dellog="${esc(String(l.ts))}">Ta bort passet</button></details>`).join(''):'<p class="small muted">Inga pass än. Första passet är det viktigaste!</p>'}</div>
 <div class="card"><h3>Säkerhetskopia</h3><p class="small muted">Allt sparas bara i din mobil. Spara en backup ibland (t.ex. i iCloud Drive) – då kan du flytta allt till en ny mobil.</p>${storageOk?'':'<p class="small" style="color:var(--red)">Webbläsaren sparar inte just nu – kopiera koden innan du stänger.</p>'}<div class="row" style="margin-top:8px"><button class="sm" data-act="savefile">Spara backup</button><button class="sm" data-act="loadfile">Läs in backup</button><button class="sm ghost" data-act="export">Kopiera som text</button></div><input type="file" id="bkfile" accept="application/json,.json" hidden></div>`;
}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}

/* ---------- Render & events ---------- */
function render(){
 $('#hello').textContent=S.set.name?'Kör hårt, '+S.set.name+'!':'Din träningskompis';
 navRender();
 const nb=checkBadges();if(nb.length&&!$('#sheet'))toast('Nytt märke: '+nb.map(b=>b.n).join(', '));
 $('#app').innerHTML=tab==='vecka'?renderVecka():tab==='pass'?renderPass():tab==='ovn'?renderOvn():tab==='kropp'?renderKropp():renderLogg();
 if(tab==='ovn'){const q=$('#q');q.oninput=()=>{bankQ=q.value;const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const D=b.dataset;
 if(D.tab){tab=D.tab;render();window.scrollTo(0,0);return}
 if(D.act==='setup')return setupSheet();
 if(D.act==='loadfile'){$('#bkfile').click();return}
 if(D.act==='savefile'){const name='torulf-backup-'+today()+'.json',blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const f=typeof File==='function'?new File([blob],name,{type:'application/json'}):null;
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup sparad');return}
 if(D.rep){repOff=+D.rep;return render()}
 if(D.act==='copyrep'){const r=report(repOff);const done=m=>{S.reportSent=r.key;save();render();toast(m)};
  if(navigator.share){navigator.share({text:r.text}).then(()=>done('Skickat!'),err=>{if(err&&err.name!=='AbortError')navigator.clipboard.writeText(r.text).then(()=>done('Kopierat – klistra in i ett sms'))})}
  else navigator.clipboard.writeText(r.text).then(()=>done('Kopierat – klistra in i ett sms'),()=>toast('Markera texten och kopiera själv'));return}
 if(D.act==='close')return closeSheet();
 if(D.act==='openday')return openDay(+D.day);
 if(D.act==='newex')return newExSheet();
 if(D.act==='newwo')return newWoSheet();
 if(D.ex)return exSheet(D.ex);
 if(D.filter){bankFilter=D.filter;return render()}
 if(D.startwo){const w=S.custom.wo.find(x=>x.id===D.startwo);if(!w)return;if(S.active&&!confirmReplace())return;const info=progInfo()||{sch:SCHEMES.muskler[0],deload:false};return startSession(w.ex.map((id,j)=>{const ex=exById(id);return ex?{id,slot:j,sc:scheme(ex,info)}:null}).filter(Boolean),w.n,null,{region:'full',mode:'full'})}
 if(D.assign)return assignSheet(D.assign);
 if(D.delwo){S.custom.wo=S.custom.wo.filter(w=>w.id!==D.delwo);Object.keys(S.assign).forEach(k=>{if(S.assign[k]===D.delwo)delete S.assign[k]});save();return render()}
 if(D.done){const [i,j]=D.done.split('-').map(Number),s=S.active.items[i].sets[j];s.done=!s.done;if(s.done&&!s.reps)s.reps=String(S.active.items[i].sc.hi);save();render();if(s.done)startTimer(COMP.includes((exById(S.active.items[i].id)||{}).p)?120:75);return}
 if(D.addset){S.active.items[+D.addset].sets.push({kg:'',reps:'',done:false});save();return render()}
 if(D.feel){S.active.feel=D.feel;save();return render()}
 if(D.act==='finish'){const A=S.active;const items=A.items.map(it=>({id:it.id,sets:it.sets.filter(s=>s.done||s.reps).map(s=>({kg:s.kg,reps:s.reps}))})).filter(it=>it.sets.length);
  if(!items.length){toast('Kryssa i minst ett set');return}
  S.logs.push({ts:Date.now(),date:A.date,title:A.title,feel:A.feel||'',mode:A.mode||'full',warm:!!A.warm,stretch:!!A.stretch,place:A.place||'gym',items});S.active=null;timerEnd=0;drawTimer();save();
  const nb=checkBadges();tab='logg';render();window.scrollTo(0,0);celebrate(A,nb);return}
 if(D.rout)return routine(D.rout);
 if(D.routdone){S.active[D.routdone]=true;save();return render()}
 if(D.act==='cancel'){if(b.dataset.sure){S.active=null;timerEnd=0;drawTimer();save();return render()}b.dataset.sure='1';b.textContent='Säker? Tryck igen';return}
 if(D.tadd){timerEnd+=30000;return drawTimer()}
 if(D.tstop){timerEnd=0;clearInterval(timer);return drawTimer()}
 if(D.sleep){const d=dly(today());d.sleep=Math.max(0,Math.min(14,(d.sleep||0)+(+D.sleep)));save();return render()}
 if(D.water){const d=dly(today()),n=+D.water;d.water=d.water===n?n-1:n;save();return render()}
 if(D.meal){const d=dly(today());d[D.meal]=!d[D.meal];save();return render()}
 if(D.dellog){if(b.dataset.sure){S.logs=S.logs.filter(l=>String(l.ts)!==D.dellog);save();return render()}b.dataset.sure='1';b.textContent='Säker? Tryck igen';return}
 if(D.act==='export'){const code=JSON.stringify(S);sheet(`<div class="row between"><h2>Din kod</h2><button class="sm ghost" data-act="close">Stäng</button></div><textarea id="ex" readonly style="min-height:160px">${esc(code)}</textarea><button class="primary" id="cp" style="width:100%;margin-top:10px">Kopiera</button>`);
  $('#cp').onclick=()=>{navigator.clipboard.writeText(code).then(()=>toast('Kopierat – klistra in i ett sms'),()=>{$('#ex').select();toast('Markera och kopiera själv')})};return}
 if(D.act==='import'){sheet(`<div class="row between"><h2>Klistra in kod</h2><button class="sm ghost" data-act="close">Stäng</button></div><p class="small muted">Ersätter allt som finns i appen nu.</p><textarea id="im"></textarea><button class="primary" id="doim" style="width:100%;margin-top:10px">Läs in</button>`);
  $('#doim').onclick=()=>{try{const o=JSON.parse($('#im').value);if(!o||typeof o!=='object'||!Array.isArray(o.logs))throw 0;S=Object.assign(fresh(),o);save();closeSheet();render();toast('Inläst')}catch(err){toast('Koden fungerade inte')}};return}
});
document.addEventListener('change',e=>{
 const t=e.target;if(t.id!=='slb'&&t.id!=='slu')return;
 const d=dly(today());d[t.id==='slb'?'bed':'up']=t.value;
 if(d.bed&&d.up){const [bh,bm]=d.bed.split(':').map(Number),[uh,um]=d.up.split(':').map(Number);let m=(uh*60+um)-(bh*60+bm);if(m<=0)m+=1440;d.sleep=Math.round(m/6)/10;d.min=m}else{d.sleep=0;d.min=0}
 save();render();
});
document.addEventListener('input',e=>{
 const t=e.target,A=S.active;if(!A)return;
 if(t.dataset.kg){const [i,j]=t.dataset.kg.split('-').map(Number);A.items[i].sets[j].kg=t.value.replace(',','.');save()}
 if(t.dataset.rp){const [i,j]=t.dataset.rp.split('-').map(Number);A.items[i].sets[j].reps=t.value;save()}
});
document.addEventListener('change',e=>{
 if(e.target.id!=='bkfile'||!e.target.files[0])return;
 e.target.files[0].text().then(t=>{const o=JSON.parse(t);if(!o||typeof o!=='object'||!Array.isArray(o.logs))throw 0;S=Object.assign(fresh(),o);save();render();toast('Backup inläst')}).catch(()=>toast('Filen fungerade inte'));
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
S.opens=S.opens||{};S.opens[today()]=true;save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
// Netlifys gratisplan lägger in en "Powered by Netlify"-bricka nere till höger som annars
// täcker flikarna och knappar längst ned. Mät brickan och lägg flikraden, vilotimern och
// formulären ovanför den så länge den syns.
function badgeFix(){const el=document.getElementById('nl-badge-frame');let px=0;
 if(el){const r=el.getBoundingClientRect(),cs=getComputedStyle(el);if(r.height>0&&cs.display!=='none'&&cs.visibility!=='hidden')px=Math.ceil(r.height)}
 document.documentElement.style.setProperty('--badge-h',px+'px')}
badgeFix();setInterval(badgeFix,1500);addEventListener('resize',badgeFix);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){S.opens[today()]=true;save();if(!$('#sheet')&&!document.activeElement.matches('input,textarea'))render()}});
if(S.active)tab='pass';
render();
setInterval(()=>{if(!$('#sheet')&&!document.activeElement.matches('input,textarea')&&(tab==='vecka'||tab==='kropp'))render()},300000);
}
</script>
</body>
</html>
